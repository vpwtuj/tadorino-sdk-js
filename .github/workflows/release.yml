name: SDK release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Documentation only: exact stable tag already published to npm (vX.Y.Z)'
        required: true
        default: 'v0.1.0'
        type: string
permissions:
  contents: read
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Match the immutable release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'const p=require("./package.json");if(process.env.RELEASE_TAG!==`v${p.version}`)throw Error("Release tag and package version must match")'
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run browser:check
      - name: Preserve the exact verified distribution
        run: |
          mkdir release-package
          npm pack --ignore-scripts --pack-destination release-package
          node --input-type=module -e 'import{readFile,readdir}from"node:fs/promises";import{createHash}from"node:crypto";const files=await readdir("release-package");if(files.length!==1)throw Error("Expected one distribution");const expected=JSON.parse(await readFile(".artifacts/package-verification.json","utf8"));const sha=createHash("sha256").update(await readFile(`release-package/${files[0]}`)).digest("hex");if(sha!==expected.tarballSha256)throw Error("Release distribution differs from tested tarball")'
      - uses: actions/upload-artifact@v7
        with:
          name: verified-sdk-distribution
          path: release-package
          if-no-files-found: error
  publish:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: verified-sdk-distribution
          path: release-package
      - name: Publish using configured npm trusted publishing
        # Initial package creation and the npm trusted publisher must be set up
        # for this repository/workflow; no long-lived npm token is stored here.
        run: npm publish release-package/*.tgz --access public --provenance
  documentation-build:
    needs: publish
    # Manual dispatch publishes documentation only. In that case both the
    # release checks and the npm publish job are intentionally skipped.
    if: >-
      ${{ always() && !cancelled() &&
          ((github.event_name == 'release' && needs.publish.result == 'success') ||
           github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    steps:
      - name: Validate the exact stable documentation tag
        id: documentation-target
        env:
          DOCUMENTATION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: |
          node --input-type=module -e 'import{appendFileSync}from"node:fs";const tag=process.env.DOCUMENTATION_TAG;if(typeof tag!=="string"||tag!==tag.trim()||!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag))throw Error("Documentation requires an exact stable vX.Y.Z tag");appendFileSync(process.env.GITHUB_OUTPUT,`tag=${tag}\n`)'
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.documentation-target.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Match the documentation tag and package version
        env:
          DOCUMENTATION_TAG: ${{ steps.documentation-target.outputs.tag }}
        run: node -e 'const p=require("./package.json");if(p.name!=="@bright203/tadorino-sdk-js"||process.env.DOCUMENTATION_TAG!==`v${p.version}`)throw Error("Documentation tag and package must match")'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - name: Wait for the exact published version to become publicly readable
        # npm can accept an upload before publish-time scanning makes it installable.
        # This only reads metadata; it never retries an upload or supplies credentials.
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';

          // Inline so documentation-only dispatch also works for older immutable tags.
          async function waitForPublishedVersion({ name, version, fetch = globalThis.fetch,
            now = () => performance.now(), sleep = ms => new Promise(resolve => setTimeout(resolve, ms)),
            log = console.log, timeoutMs = 15 * 60_000, intervalMs = 30_000, requestTimeoutMs = 10_000 }) {
            if (name !== '@bright203/tadorino-sdk-js' || typeof version !== 'string' || version !== version.trim() || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error('Registry wait requires the exact stable SDK package version.');
            }
            const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
            const deadline = now() + timeoutMs;
            let attempt = 0;
            while (now() < deadline) {
              attempt++;
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), Math.min(requestTimeoutMs, deadline - now()));
              let response;
              let reason = 'registry transport interrupted';
              try {
                try {
                  response = await fetch(url, { signal: controller.signal, credentials: 'omit', redirect: 'manual',
                    cache: 'no-store', headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' } });
                } catch { /* Transport failures are retried within the same deadline. */ }
                if (response?.status === 200) {
                  if (!/^application\/json(?:\s*;|$)/i.test(response.headers.get('content-type') ?? '')) {
                    throw new Error('Registry returned malformed package metadata.');
                  }
                  let metadata;
                  try { metadata = await response.json(); }
                  catch (error) {
                    if (!controller.signal.aborted && error instanceof SyntaxError) throw new Error('Registry returned malformed package metadata.');
                  }
                  if (metadata !== undefined) {
                    if (!metadata || typeof metadata !== 'object' || metadata.name !== name || metadata.version !== version) {
                      throw new Error('Registry package name or version does not match the release.');
                    }
                    if (now() >= deadline) break;
                    log(`Published ${name}@${version} is readable from the public registry.`);
                    return;
                  }
                } else if (response) {
                  if (response.status !== 404 && response.status !== 429 && (response.status < 500 || response.status > 599)) {
                    throw new Error(`Registry rejected the availability check with HTTP ${response.status}.`);
                  }
                  reason = `HTTP ${response.status}`;
                }
              } finally {
                clearTimeout(timer);
                if (response?.body && !response.body.locked) void response.body.cancel().catch(() => {});
              }
              const remaining = deadline - now();
              if (remaining <= 0) break;
              log(`Waiting for public ${name}@${version}: ${reason}, attempt ${attempt}.`);
              await sleep(Math.min(intervalMs, remaining));
            }
            throw new Error('Package version is not publicly readable after the bounded registry wait. Resume documentation later; do not republish the same version.');
          }

          const manifest = JSON.parse(await readFile('package.json', 'utf8'));
          await waitForPublishedVersion({ name: manifest.name, version: manifest.version });
          JS
      - name: Generate matching versioned documentation after npm success
        run: node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
  documentation:
    needs: documentation-build
    if: ${{ always() && !cancelled() && needs.documentation-build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated release documentation
        id: deployment
        uses: actions/deploy-pages@v5
