name: SDK checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install browser test engines
        if: matrix.node == '24'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test real browser requests against the synthetic fixture
        if: matrix.node == '24'
        run: npm run browser:check
      - name: Keep generated documentation for review
        if: matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: sdk-documentation-preview
          path: site
          if-no-files-found: error
      - name: Keep browser failure evidence
        if: failure() && matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: |
            .artifacts/browser
            .artifacts/browser-results.json
          include-hidden-files: true
          if-no-files-found: ignore
